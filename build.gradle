plugins {
	id 'idea'
	id 'java-library'
	id 'maven-publish'
	id 'org.cadixdev.licenser' version '0.6.1'
	id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = mod_version
group = mod_group_id

base {
	archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

license {
	header 'LICENSE'
	ignoreFailures = true
}

sourceSets.main.resources {
	setSrcDirs(['src/generated/resources', 'src/main/resources'])
	exclude '**/*.bbmodel'
	exclude 'src/generated/**/.cache'
}

repositories {
	mavenLocal()
	mavenCentral()

	maven {
		name = 'NeoForge'
		url = 'https://maven.neoforged.net/releases'
	}

	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com'
		content {
			includeGroup 'vazkii.patchouli'
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	implementation "net.neoforged:neoforge:${neo_version}"
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

runs {
	configureEach {
		systemProperty 'forge.logging.markers', 'REGISTRIES'
		systemProperty 'forge.logging.console.level', 'info'
		workingDirectory project.layout.projectDirectory.dir('run').dir(name)
		modSource project.sourceSets.main
	}

	client {
		systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
	}

	server {
		systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
		argument '--nogui'
	}

	gameTestServer {
		systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
	}

	data {
		arguments.addAll(
				'--mod', mod_id,
				'--all',
				'--output', file('src/generated/resources').absolutePath,
				'--existing', file('src/main/resources').absolutePath
		)
	}
}

tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	
	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			neo_version            : neo_version,
			neo_version_range      : neo_version_range,
			loader_version_range   : loader_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

java {
	withSourcesJar()
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	
	repositories {
		maven {
			name = 'AstromineMaven'
			url = uri(System.getenv('MAVEN_URL') ?: 'https://maven.vini2003.dev/releases')
			credentials {
				username = System.getenv('MAVEN_USER') ?: 'vini2003'
				password = System.getenv('MAVEN_PASS') ?: ''
			}
		}
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
