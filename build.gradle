plugins {
	id 'idea'
	id 'java-library'
	id 'maven-publish'
	id 'org.cadixdev.licenser' version '0.6.1'
	id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = mod_version
group = mod_group_id

base {
	archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

license {
	header 'LICENSE'
	ignoreFailures = true
}

sourceSets.main.resources {
	setSrcDirs(['src/generated/resources', 'src/main/resources'])
	exclude '**/*.bbmodel'
	exclude 'src/generated/**/.cache'
}

repositories {
	mavenLocal()
	mavenCentral()

	maven {
		name = 'NeoForge'
		url = 'https://maven.neoforged.net/releases'
	}

	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com'
		content {
			includeGroup 'vazkii.patchouli'
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	implementation "net.neoforged:neoforge:${neo_version}"
	implementation "vazkii.patchouli:Patchouli:${patchouli_version}"
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

runs {
	configureEach {
		systemProperty 'forge.logging.markers', 'REGISTRIES'
		systemProperty 'forge.logging.console.level', 'info'
		workingDirectory project.layout.projectDirectory.dir('run').dir(name)
		modSource project.sourceSets.main
	}

	client {
		systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
	}

	server {
		systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
		argument '--nogui'
	}

	gameTestServer {
		systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
	}

	data {
		arguments.addAll(
				'--mod', mod_id,
				'--all',
				'--output', file('src/generated/resources').absolutePath,
				'--existing', file('src/main/resources').absolutePath
		)
	}
}

tasks.register('cleanGameTestServerWorld', Delete) {
	group = 'verification'
	description = 'Deletes the generated GameTest world so server shutdown and chunk unloads stay deterministic.'
	delete layout.projectDirectory.dir('run/gameTestServer/world')
}

tasks.configureEach {
	if (name == 'runGameTestServer') {
		dependsOn tasks.named('cleanGameTestServerWorld')
	}
}

tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			neo_version            : neo_version,
			neo_version_range      : neo_version_range,
			loader_version_range   : loader_version_range,
			patchouli_version      : patchouli_version,
			patchouli_version_range: patchouli_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

java {
	withSourcesJar()
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}

	if (mavenPublishingConfigured()) {
		repositories {
			maven {
				name = 'AstromineMaven'
				url = uri(System.getenv('MAVEN_URL'))
				credentials {
					username = System.getenv('MAVEN_USER')
					password = System.getenv('MAVEN_PASS')
				}
			}
		}
	}
}

tasks.named('publish').configure {
	if (!mavenPublishingConfigured()) {
		var missing = ['MAVEN_URL', 'MAVEN_USER', 'MAVEN_PASS'].findAll { name ->
			var value = System.getenv(name)
			value == null || value.isBlank()
		}

		doFirst {
			throw new GradleException("Missing required Maven publishing environment variables: ${missing.join(', ')}")
		}
	}
}

tasks.register('verifyClientAssets') {
	group = 'verification'
	description = 'Verifies Astromine client model, blockstate, and texture references resolve.'

	var javaSources = fileTree('src/main/java') {
		include '**/*.java'
	}
	var assetSources = files(
			fileTree('src/main/resources/assets/astromine') {
				include '**/*'
			},
			fileTree('src/generated/resources/assets/astromine') {
				include '**/*'
			}
	)
	inputs.files(javaSources, assetSources)

	doLast {
		var assetRoots = [
				file('src/main/resources/assets/astromine'),
				file('src/generated/resources/assets/astromine')
		].findAll { it.exists() }
		var missing = []
		var jsonSlurper = new groovy.json.JsonSlurper()
		var assetExists = { String assetPath ->
			assetRoots.any { root -> new File(root, assetPath).exists() }
		}
		var astromineAsset = { Object id, String kind ->
			if (!(id instanceof String) || !id.startsWith('astromine:') || id.startsWith('#')) {
				return null
			}

			var name = id.substring('astromine:'.length())
			return kind == 'model' ? "models/${name}.json" : "textures/${name}.png"
		}
		def collectModelReferences
		collectModelReferences = { Object node, List<String> references ->
			if (node instanceof Map) {
				if (node.model instanceof String) {
					references.add(node.model)
				}

				node.values().each { value -> collectModelReferences(value, references) }
			} else if (node instanceof Iterable) {
				node.each { value -> collectModelReferences(value, references) }
			}
		}

		javaSources.each { source ->
			def matcher = source.text =~ /AMCommon\.id\("([^"]+)"\)/

			matcher.each { match ->
				var id = match[1]

				if (id.startsWith('textures/') && !assetExists(id)) {
					missing.add("${source}: missing texture ${id}")
				}
			}
		}

		assetRoots.each { root ->
			fileTree(new File(root, 'models')) {
				include '**/*.json'
			}.each { modelFile ->
				var json = jsonSlurper.parse(modelFile)
				var parent = astromineAsset(json.parent, 'model')

				if (parent != null && !assetExists(parent)) {
					missing.add("${modelFile}: missing parent ${json.parent} -> ${parent}")
				}

				if (json.textures instanceof Map) {
					json.textures.each { key, value ->
						var texture = astromineAsset(value, 'texture')

						if (texture != null && !assetExists(texture)) {
							missing.add("${modelFile}: missing texture ${key}=${value} -> ${texture}")
						}
					}
				}
			}

			fileTree(new File(root, 'blockstates')) {
				include '**/*.json'
			}.each { blockstateFile ->
				var references = []
				collectModelReferences(jsonSlurper.parse(blockstateFile), references)

				references.each { reference ->
					var model = astromineAsset(reference, 'model')

					if (model != null && !assetExists(model)) {
						missing.add("${blockstateFile}: missing model ${reference} -> ${model}")
					}
				}
			}
		}

		var amModels = file('src/main/java/com/github/mixinors/astromine/registry/client/AMModels.java')

		if (amModels.exists()) {
			def matcher = amModels.text =~ /AMCommon\.id\("(block\/[^"]+)"\)/

			matcher.each { match ->
				var model = "models/${match[1]}.json"

				if (!assetExists(model)) {
					missing.add("${amModels}: missing registered model ${model}")
				}
			}
		}

		if (!missing.isEmpty()) {
			throw new GradleException("Missing Astromine client assets:\n - ${missing.join('\n - ')}")
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyClientAssets')
}

static boolean mavenPublishingConfigured() {
	return ['MAVEN_URL', 'MAVEN_USER', 'MAVEN_PASS'].every { name ->
		var value = System.getenv(name)
		value != null && !value.isBlank()
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
